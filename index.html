:root{
  --ink:#0C1A2B;
  --rail:#0F2135;
  --chalk:#EEF4F9;
  --brass:#D9A441;
  --slate:#62809A;
  --line:rgba(255,255,255,.09);
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--ui);
  display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
/* faint drafting grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;
}

/* ---------- rails ---------- */
.rail{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:18px;
  padding:14px 20px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--slate);
  cursor:default;
}
.rail.top{border-bottom:1px solid var(--line);flex-wrap:wrap}
.rail.bottom{border-top:1px solid var(--line);margin-top:auto}
.mark{color:var(--chalk);letter-spacing:.22em}
.spacer{flex:1}

.group{display:flex;align-items:center;gap:8px}
.group>span{color:var(--slate)}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{
  font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  background:transparent;color:var(--slate);
  border:0;border-right:1px solid var(--line);
  padding:6px 10px;cursor:pointer;
  transition:color .15s,background .15s;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--chalk)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#12202E}
.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

.cache{color:var(--slate)}
.cache.ok{color:var(--brass)}

/* ---------- stage ---------- */
#stage{
  position:relative;z-index:1;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:34px;padding:16px;
}
#card{
  display:flex;align-items:center;justify-content:center;
  min-height:0;width:100%;
  transition:filter .17s ease,transform .17s ease,opacity .17s ease;
}
#card.snap{filter:blur(9px);transform:scale(.965);opacity:0}

#hands{
  font-family:"Gallaudet";
  color:var(--chalk);
  line-height:1;white-space:nowrap;
}
#answer{
  font-weight:600;letter-spacing:.05em;
  color:var(--brass);
  line-height:1;white-space:nowrap;
}
.hide{display:none}

/* ---------- hint ---------- */
#hint{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--slate);text-align:center;
  transition:opacity .17s;
}
#hint.dim{opacity:0}

@media (max-width:620px){
  .rail{gap:12px;padding:11px 14px;font-size:9px}
  .rail .group>span{display:none}
  .rail.bottom{flex-wrap:wrap;gap:10px}
  .credit{display:none}
  #stage{gap:24px}
}
@media (prefers-reduced-motion:reduce){
  #card,#hint{transition:none}
  #card.snap{filter:none;transform:none;opacity:1}
}
</style>
</head>

STEPHEN", "STEWART", "SUE", "SUSAN", "SUZANNE", "SYLVIA", "TAMARA", "TANYA", "TARA", "TED", "TERESA", "TERRY", "THEO", "THEODORE", "THERESA", "THOMAS", "TIFFANY", "TIM", "TIMOTHY", "TINA", "TODD", "TOM", "TONI", "TONY", "TRACY", "TREVOR", "TROY", "TYLER", "VAL", "VALERIE", "VANESSA", "VERA", "VERONICA", "VICTOR", "VICTORIA", "VINCENT", "VIOLET", "VIRGINIA", "VIVIAN", "WADE", "WALLACE", "WALTER", "WANDA", "WARD", "WARREN", "WENDY", "WESLEY", "WHITNEY", "WILL", "WILLIAM", "WILMA", "WINIFRED", "XAVIER", "YOLANDA", "YVONNE", "ZACH", "ZACHARY", "ZANE", "ZARA", "ZOE", "ZOEY"];
const BOTH  = [...new Set([...WORDS, ...NAMES])];

/* ---------- audio (one file per word, served from ./audio) ---------- */
const AUDIO_DIR = 'audio/';
const clipURL = w => AUDIO_DIR + encodeURIComponent(w) + '.mp3';

let audioOn = true;
const player = new Audio();
player.preload = 'auto';

// Load the current word's clip ahead of the reveal so playback is lag-free.
function preloadCurrent(){
  if(!audioOn || !current) return;
  const u = clipURL(current);
  if(player.src && player.src.endsWith(u)) return;
  try{ player.src = u; player.load(); }catch(e){}
}
function playCurrent(){
  if(!audioOn || !current) return;
  const u = clipURL(current);
  try{
    if(!(player.src && player.src.endsWith(u))) player.src = u;
    player.currentTime = 0;
    const p = player.play();
    if(p && p.catch) p.catch(()=>{});   // ignore autoplay rejections
  }catch(e){}
}

const hands=document.getElementById('hands'),
      answer=document.getElementById('answer'),
      card=document.getElementById('card'),
      hint=document.getElementById('hint'),
      stage=document.getElementById('stage'),
      countEl=document.getElementById('count'),
      poolEl=document.getElementById('pool');

let lenMode='all', bankMode='words', revealMs=1000;
let bag=[], current=null, state='question', seen=0, timer=null;

const inRange=w=>lenMode==='all'||(lenMode==='s'&&w.length<=4)||
                 (lenMode==='m'&&w.length>=5&&w.length<=6)||
                 (lenMode==='l'&&w.length>=7);

function source(){ return bankMode==='names'?NAMES:bankMode==='both'?BOTH:WORDS; }
function pool(){ return source().filter(inRange); }

/* shuffled bag: random order, but no repeat until the pool is used up */
function refill(){
  bag=pool();
  for(let i=bag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [bag[i],bag[j]]=[bag[j],bag[i]];
  }
  if(current&&bag.length>1&&bag[bag.length-1]===current) bag.unshift(bag.pop());
}

/* scale text to fill the stage without overflowing */
function fit(el,maxPx){
  const w=stage.clientWidth*0.90, h=stage.clientHeight*0.58;
  el.style.fontSize=maxPx+'px';
  const nw=el.scrollWidth, nh=el.scrollHeight;
  if(!nw||!nh) return;
  const s=Math.min(w/nw,h/nh,1);
  el.style.fontSize=Math.max(22,Math.floor(maxPx*s))+'px';
}

function showQuestion(){
  state='question';
  answer.classList.add('hide');
  hands.classList.remove('hide');
  hands.textContent=current;
  fit(hands,320);
  hint.classList.remove('dim');
  preloadCurrent();          // warm the clip while the handshapes are shown
}

function nextCard(){
  if(!bag.length) refill();
  if(!bag.length){ current=null; hands.textContent='\u2014'; return; }
  current=bag.pop();
  showQuestion();
}

function reveal(){
  if(state!=='question'||!current) return;
  state='answer';
  seen++; countEl.textContent=seen;

  card.classList.add('snap');
  hint.classList.add('dim');

  setTimeout(()=>{
    hands.classList.add('hide');
    answer.classList.remove('hide');
    answer.textContent=current;
    fit(answer,190);
    card.classList.remove('snap');
    playCurrent();

    timer=setTimeout(()=>{
      card.classList.add('snap');
      setTimeout(()=>{ nextCard(); card.classList.remove('snap'); },170);
    },revealMs);
  },170);
}

/* ---- input ---- */
document.addEventListener('click',e=>{
  if(e.target.closest('.rail')) return;
  if(state==='answer') return;          // ignore extra clicks until the next card
  reveal();
});
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON') return;
    e.preventDefault();
    if(state==='answer') return;
    reveal();
  }
  if(e.key==='ArrowRight'&&state==='question'){ e.preventDefault(); nextCard(); }
});

function restart(){
  clearTimeout(timer);
  card.classList.remove('snap');
  poolEl.textContent=pool().length;
  refill(); nextCard();
}

document.getElementById('audioSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  audioOn=b.dataset.audio==='on'; b.blur();
  if(!audioOn){ try{player.pause();}catch(e){} }
  else preloadCurrent();   // ready for the next reveal, but don't replay now
});
document.getElementById('bankSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  bankMode=b.dataset.bank; b.blur(); restart();
});
document.getElementById('lenSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  lenMode=b.dataset.len; b.blur(); restart();
});
document.getElementById('paceSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  revealMs=+b.dataset.ms; b.blur();
});

addEventListener('resize',()=>{
  if(state==='question') fit(hands,320); else fit(answer,190);
});

/* ---------- aggressive background prefetch ----------
   Warm the cache for the whole bank after first paint so every word is
   instant and available offline. Concurrency-limited; never blocks the UI. */
function startPrefetch(){
  const all = BOTH.slice();
  for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]];}
  const total = all.length, cacheEl = document.getElementById('cache');
  let done = 0, idx = 0;
  const CONC = 8;
  function tick(){
    if(!cacheEl) return;
    cacheEl.textContent = done < total ? '\u00b7 caching audio '+done+'/'+total : '\u00b7 ready offline';
    cacheEl.classList.toggle('ok', done>=total);
  }
  function next(){
    if(idx >= total) return Promise.resolve();
    const w = all[idx++];
    return fetch(clipURL(w), {cache:'force-cache'})
      .then(r => r && r.arrayBuffer ? r.arrayBuffer() : null)   // drain so the connection frees
      .catch(()=>{})
      .then(()=>{ done++; if(done % 15 === 0 || done === total) tick(); return next(); });
  }
  tick();
  const runners = [];
  for(let i=0;i<CONC;i++) runners.push(next());
  Promise.all(runners).then(()=>{ tick(); if(cacheEl) setTimeout(()=>{cacheEl.textContent='';}, 4000); });
}

/* ---------- service worker (offline + install) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=> navigator.serviceWorker.ready)
      .then(()=> startPrefetch())
      .catch(()=> startPrefetch());
  });
} else {
  window.addEventListener('load', startPrefetch);
}

/* ---------- init ---------- */
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve())
  .then(()=>{ poolEl.textContent=pool().length; refill(); nextCard(); });
